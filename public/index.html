<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillLink Nigeria - Premium Artisan Marketplace</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Auth Pages -->
  <div id="authContainer" class="auth-container">
    <!-- Login Page -->
    <div id="loginPage" class="auth-page active">
      <div class="auth-card">
        <div class="auth-header">
          <h1>🔧 SkillLink Nigeria</h1>
          <p>Premium Artisan Marketplace</p>
        </div>
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required placeholder="Enter password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
          <p class="auth-toggle">Don't have an account? <a href="#" onclick="switchToSignup()">Sign Up</a></p>
        </form>
      </div>
    </div>

    <!-- Signup Page -->
    <div id="signupPage" class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <h1>🔧 SkillLink Nigeria</h1>
          <p>Join Our Marketplace</p>
        </div>
        <form id="signupForm" class="auth-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="signupName" required placeholder="Your full name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signupEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="signupPhone" placeholder="08012345678">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signupPassword" required placeholder="Create password">
          </div>
          <div class="form-group">
            <label>I am a...</label>
            <select id="signupRole" required>
              <option value="">Select role</option>
              <option value="customer">Customer (Looking for services)</option>
              <option value="artisan">Artisan (Offering services)</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
          <p class="auth-toggle">Already have an account? <a href="#" onclick="switchToLogin()">Login</a></p>
        </form>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="main-app" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">🔧 SkillLink</div>
        <nav class="nav">
          <a href="#" onclick="showDashboard()" class="nav-link">Dashboard</a>
          <a href="#" onclick="showArtisans()" class="nav-link">Find Artisans</a>
          <a href="#" onclick="showBookings()" class="nav-link">Bookings</a>
          <button onclick="logout()" class="btn btn-outline">Logout</button>
        </nav>
      </div>
    </header>

    <!-- Dashboard Page -->
    <div id="dashboardPage" class="page active">
      <div class="container">
        <div class="dashboard-grid">
          <div class="dashboard-card">
            <h2 id="welcomeText">Welcome back!</h2>
            <p id="userEmail"></p>
            <div class="user-info" id="userInfo"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Artisans Page -->
    <div id="artisansPage" class="page">
      <div class="container">
        <div class="search-section">
          <h2>Find Skilled Artisans</h2>
          <div class="search-form">
            <input type="text" id="searchQuery" placeholder="Search by service or name...">
            <select id="stateFilter">
              <option value="">All States</option>
              <option>Lagos</option>
              <option>Abuja</option>
              <option>Ekiti</option>
              <option>Oyo</option>
              <option>Rivers</option>
              <option>Enugu</option>
            </select>
            <input type="text" id="lgaFilter" placeholder="LGA">
            <button onclick="searchArtisans()" class="btn btn-primary">Search</button>
          </div>
        </div>
        <div id="artisansList" class="artisans-grid"></div>
      </div>
    </div>

    <!-- Bookings Page -->
    <div id="bookingsPage" class="page">
      <div class="container">
        <h2>My Bookings</h2>
        <div id="bookingsList" class="bookings-list"></div>
      </div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Book Artisan</h2>
      <form id="bookingForm" class="booking-form">
        <div class="form-group">
          <label>Service Required</label>
          <input type="text" id="bookingService" required>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="bookingDate" required>
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="bookingTime" required>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="bookingLocation" required>
        </div>
        <div class="form-group">
          <label>Notes (Optional)</label>
          <textarea id="bookingNotes" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit Booking</button>
      </form>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script src="/app.js"></script>
</body>
</html>
